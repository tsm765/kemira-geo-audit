# verdicts_input.yaml — S5 adjudication, one verdict per unique claim
#
# Built into data/verdicts.json by: python -m src.verdicts build
# Review sheet (passage first, then verdict, then claim): python -m src.verdicts review
#
# Rules (CLAUDE.md):
# - Retrieval, not grading: every verdict rests on one passage of ground truth,
#   one to three sentences forming one coherent passage on one point, quoted
#   verbatim from data/ground_truth/<source>/<file>. Never stacked snippets.
# - verdict: supported | contradicted | unverified | source_conflict | not_adjudicated
# - contradicted carries contradiction_type: assistant_wrong | source_unclear
# - source_conflict: the claim matches some of Kemira's published material and
#   conflicts with other parts, so the ground truth cannot settle it. The one
#   case where two passages are cited: `evidence` (what the claim matches) and
#   `conflicting_evidence` (what it conflicts with). The conflict is the evidence.
# - A partly addressed claim is supported (with a note) only if the unaddressed
#   part is incidental; if it is material to the claim, it is unverified.
# - unverified where the ground truth genuinely does not settle the claim; it
#   may carry the closest passage as evidence, with the reason stated.
# - Other relevant sources go in `see_also` as pointers (source, page, what it
#   says in a few words), never as additional quoted evidence.
# - status: proposed (by Claude Code) -> confirmed / revised (by the human).
#   Only confirmed and revised verdicts are written to verdicts.json.

