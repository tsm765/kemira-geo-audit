  target_scope12_51_2: {page: S11, also_involved: [S13, S17, S22], reason: Mirror of target_scope12_2030 (SF06).}
  target_scope3_2033: {page: S11, also_involved: [S13, S17, S22], reason: Web pages state 33%, reports 32.5% (SF06).}
  target_scope3_32_5: {page: S11, also_involved: [S13, S17, S22], reason: Mirror of target_scope3_2033 (SF06).}
