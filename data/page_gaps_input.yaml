# page_gaps_input.yaml — S7, hand-made input for data/page_gaps.json
#
# Review sheet (direct-answer judgements, passage first): python -m src.page_gaps review
# Build: python -m src.page_gaps build   (confirmed/revised entries only)
#
# S7 shape (CLAUDE.md): (1) a site-wide structural diagnosis stated once, because
# the captured structural signals do not vary between pages; (2) a per-page
# content-gap list ranked by claim instances fixed. The direct-answer signal is
# the one page-level signal with real variation and carries weight per page.
# Diagnosis only: nothing here proposes or writes content for Kemira.

site_wide:
  - id: schema
    statement: No captured page carries Organization or Corporation schema. All 21 captured HTML pages carry the same default schema set (WebPage, WebSite, BreadcrumbList, ListItem, SearchAction, ReadAction, EntryPoint, PropertyValueSpecification; ImageObject on some).
    structural_finding: SF02
    status: confirmed
  - id: faq
    statement: Only one captured page (S19, the investor FAQ) has an FAQ block, and it carries no FAQPage markup. S19 is never cited by any assistant.
    structural_finding: SF02
    status: confirmed
  - id: h1
    statement: 19 of 21 captured HTML pages have no h1 element. The homepage has four, all carousel slides (the first is 'Introducing KemAlpha renewable polymers'); only /water/wastewater has a single page-title h1.
    structural_finding: SF09
    status: confirmed

# Direct answer: does the first screen of main content answer the page's implied
# question? Judged from the first three content blocks recorded in meta.local.json.
# judgement: answers | partial | no ; opens_with: answer | framing | date | promo | heading
direct_answer:
  S01:
    question: What is Kemira?
    judgement: answers
    opens_with: heading
    reason: After a 'Company' label and 'About us' heading, the first paragraph answers directly ('Kemira is a global leader in sustainable chemistry for water-intensive industries...').
    status: confirmed
  S02:
    question: What is Kemira?
    judgement: partial
    opens_with: promo
    reason: Opens with a promotional carousel (KemAlpha launch, REPUR acquisition, interim report), then a generic line ('in the business of chemistry expertise'); the identity statement comes third.
    status: confirmed
  S03:
    question: What is Kemira's strategy and business model?
    judgement: "no"
    opens_with: date
    reason: Opens with a date (5/29/2026), then aspirational framing ('Clean water, sanitation, and the smart use of limited resources are key components of quality of life'); the strategy is not stated in the first blocks.
    status: confirmed
  S04:
    question: What are Kemira's business units and markets?
    judgement: partial
    opens_with: date
    reason: Opens with a date (5/29/2026); the first paragraph describes the focus areas in general terms but does not name the three business units.
    status: confirmed
  S05:
    question: What is Kemira's outlook and what are its financial targets?
    judgement: "no"
    opens_with: date
    reason: Opens with a date (7/17/2026) followed by two headings; no outlook or target is stated in the first blocks.
    status: confirmed
  S06:
    question: What water treatment solutions does Kemira offer?
    judgement: partial
    opens_with: framing
    reason: Opens with the customer's problem (tightening regulation, megatrends); the offering follows only generically ('a range of innovative solutions'), with no products named.
    status: confirmed
  S07:
    question: What does Kemira offer for wastewater treatment?
    judgement: "no"
    opens_with: framing
    reason: Opens with general statements about chemical treatment ('has been around for a long time... safe, reliable and cost-effective'); Kemira's own offering is not stated in the first blocks.
    status: confirmed
  S08:
    question: What does Kemira offer for raw and drinking water?
    judgement: "no"
    opens_with: framing
    reason: Opens with general freshwater facts ('Less than 3% of all water on earth is freshwater...'); Kemira's offering appears only in general terms in the third block.
    status: confirmed
  S09:
    question: How does Kemira help with sludge treatment and dewatering?
    judgement: partial
    opens_with: framing
    reason: Opens with the problem ('Sludge dewatering can be a tricky operation'), then a generic offering ('Our complete product portfolio and deep knowledge...'); no products, outcomes or figures in the first blocks.
    status: confirmed
  S10:
    question: What digital services does Kemira offer for water treatment?
    judgement: "no"
    opens_with: heading
    reason: Opens with a title, a product name (Kemira KemConnect) and a tagline ('The science of water treatment - the power of data'); what the services do is not stated in the first blocks.
    status: confirmed
  S11:
    question: What is Kemira's approach to sustainability and what are its targets?
    judgement: "no"
    opens_with: framing
    reason: Opens with purpose framing ('Chemistry plays a critical role...', 'This is why Kemira exists...'); the approach and targets appear further down the page.
    status: confirmed
  S12:
    question: What is Kemira's sustainability approach?
    judgement: "no"
    opens_with: framing
    reason: Opens with general statements ('Sustainability touches nearly all aspects of our business'); the approach is not stated concretely in the first blocks.
    status: confirmed
  S13:
    question: What are Kemira's climate targets?
    judgement: partial
    opens_with: framing
    reason: The first paragraph is framing (climate change, Paris Agreement); the second states the 2045 carbon-neutrality ambition (Scopes 1 and 2) and SBTi alignment. The specific near-term targets are not in the first blocks.
    status: confirmed
  S14:
    question: What is Kemira doing on circularity?
    judgement: "no"
    opens_with: framing
    reason: Opens with a general description of the circular economy and a commitment statement, then a 'Targets & KPIs' heading; no target or figure in the first blocks.
    status: confirmed
  S15:
    question: What is Kemira's water stewardship approach?
    judgement: "no"
    opens_with: framing
    reason: Opens with positioning ('Kemira is in the business of chemistry for water management...'); the stewardship approach is not stated in the first blocks.
    status: confirmed
  S16:
    question: What are Kemira's sustainability key indicators?
    judgement: "no"
    opens_with: date
    reason: Opens with a date (2/13/2025) and a heading; the indicators themselves are not in the page HTML (served from an embedded third-party tool, SF01).
    status: confirmed
  S17:
    question: What does Kemira's 2025 annual report say?
    judgement: partial
    opens_with: heading
    reason: The landing page opens with Kemira's identity statement and an invitation to explore the report; no headline figures for 2025 in the first blocks.
    status: confirmed
  S18:
    question: Where are Kemira's reports and presentations?
    judgement: partial
    opens_with: date
    reason: Opens with a date (7/17/2026), then the latest results headline; no report documents are linked from the first blocks (SF03).
    status: confirmed
  S19:
    question: What are the answers to common questions about Kemira?
    judgement: partial
    opens_with: date
    reason: Opens with a date (10/15/2026), then the FAQ heading and a section label ('About Kemira'); the question-and-answer content follows, but the page carries no FAQPage markup.
    status: confirmed
  S20:
    question: Where is Kemira listed and what is its share information?
    judgement: partial
    opens_with: date
    reason: Opens with a date (7/21/2026); the first paragraph gives share capital and share count, while the exchange and trading code come further down.
    status: confirmed
  S21:
    question: Where is Kemira headquartered and how do I contact it?
    judgement: answers
    opens_with: heading
    reason: The first paragraph states the headquarters ('Our company headquarters is located in Helsinki, Finland'), followed by the address.
    status: confirmed

# Each claim that is not `supported`, mapped to the captured page that should
