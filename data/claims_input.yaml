# claims_input.yaml — hand-made claim extraction (S4)
#
# Built into data/claims.json by: python -m src.claims
# Granularity: a claim is what a reader would check as one unit against one
# source passage. Keep together what stands or falls together; separate what
# could be independently wrong and matters on its own. One instance per claim
# per answer (repeats and roundings in the same answer are one instance).
# Quotes are verbatim from the answer; " … " joins non-adjacent spans.
# Claims about companies other than Kemira are not extracted (share of voice is S6).
#
# Recurring conventions:
# - "headquartered in Helsinki" -> hq_helsinki; "Finnish" alone or "based in
#   Finland" -> finnish_company. A city-level statement absorbs the nationality.
# - Generic descriptions of what Kemira serves -> serves_water_treatment /
#   serves_fiber_industries. Kemira's own segment names -> segments_three.
# - Elaboration of a framework or segment (sub-bullets restating it) is not
#   extracted separately; see notes.
# - Image-card captions copied with the answer (ChatGPT) are extracted when they
#   assert a fact about Kemira, and noted as captions. Captions about other
#   companies or generic images are not extracted.
# - The assistant's own analysis or opinion ("its competitive advantage lies
#   in...", "growth is tied to...") is not a claim about Kemira; not extracted.
# - Water reuse and sludge treatment fold into serves_water_treatment; data
#   centres, oil and gas, metals fold into serves_other_industries.

claims:
